  .tag.imp-high{color:#fff;background:var(--green);border-color:var(--green)}
  h3{font-size:15.5px;margin:0 0 7px;line-height:1.5;font-weight:600}
  .gist{font-size:14px;color:#43433D;margin:0}
  a{color:var(--green);font-size:12.5px}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:13.5px;color:var(--sub)}
  .legend{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}
</style>

22.htm", "title": "工业和信息化部 国家林业和草原局关于推进“宽带林草”建设的通知", "date": "2025-09-09", "lib": "部门文件", "topic_hint": "农业、林业、水利\\林业", "hasBody": true, "importance": "中", "topic": "乡村振兴", "gist": "工信部、国家林草局部署推进“宽带林草”建设，提升林区和草原通信网络供给水平，支撑生态保护、火灾防控和经济转型。到2027年底林场（所）驻地通4G/5G网络比例达90%，重点点位基本实现宽带覆盖。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7039980.htm", "title": "国务院关于新建黄岩岛国家级自然保护区的批复", "date": "2025-09-10", "lib": "国务院文件", "topic_hint": "城乡建设、环境保护\\环境监测、保护与治理", "hasBody": true, "importance": "中", "topic": "绿色低碳", "gist": "国务院同意新建黄岩岛国家级自然保护区，维护其自然生态系统多样性、稳定性、持续性，要求严格执行自然保护区条例，落实生态环境保护责任，面积、范围和功能分区由国家林草局另行公布。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040458.htm", "title": "国家发展改革委 国家能源局关于完善价格机制促进新能源发电就近消纳的通知", "date": "2025-09-12", "lib": "部门文件", "topic_hint": "国土资源、能源\\电力", "hasBody": true, "importance": "中", "topic": "绿色低碳", "gist": "国家发改委、国家能源局完善价格机制促进新能源就近消纳，明确项目自发自用电量比例要求，按谁受益谁负担原则公平承担输配电费和系统运行费，推动能源绿色低碳转型。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040298.htm", "title": "三部门关于印发《电力装备行业稳增长工作方案（2025-2026年）》的通知", "date": "2025-09-12", "lib": "部门文件", "topic_hint": "国土资源、能源\\电力", "hasBody": true, "importance": "中", "topic": "经济发展", "gist": "工信部等三部门印发电力装备行业稳增长工作方案（2025—2026年），部署稳定电力装备行业增长、推动产业高质量发展相关举措。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040296.htm", "title": "关于印发《新型储能规模化建设专项行动方案(2025—2027年)》的通知", "date": "2025-09-12", "lib": "部门文件", "topic_hint": "国土资源、能源\\其他", "hasBody": true, "importance": "中", "topic": "科技创新", "gist": "国家发改委、国家能源局印发新型储能规模化建设专项行动方案（2025—2027年），部署推动新型储能规模化高质量发展，明确建设目标和重点任务。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040253.htm", "title": "国家发展改革委 国家能源局关于推进“人工智能+”能源高质量发展的实施意见", "date": "2025-09-12", "lib": "部门文件", "topic_hint": "国土资源、能源\\其他", "hasBody": true, "importance": "中", "topic": "科技创新", "gist": "国家发改委、国家能源局部署推进人工智能+能源高质量发展，到2027年推动五个以上专业大模型深度应用、挖掘十个以上示范项目、探索百个典型应用场景，培育能源领域新质生产力。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040571.htm", "title": "人力资源社会保障部办公厅关于发布《企业实施竞业限制合规指引》的通知", "date": "2025-09-13", "lib": "部门文件", "topic_hint": "劳动、人事、监察\\劳动就业", "hasBody": true, "importance": "中", "topic": "民生保障", "gist": "人社部发布企业竞业限制合规指引，要求企业遵循必要合理原则实施竞业限制，科学确定范围、规范流程，统筹保护企业商业秘密和劳动者就业择业权。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040552.htm", "title": "工业和信息化部等八部门关于印发《汽车行业稳增长工作方案（2025—2026年）》的通知", "date": "2025-09-13", "lib": "部门文件", "topic_hint": "工业、交通\\机械制造与重工业", "hasBody": true, "importance": "中", "topic": "经济发展", "gist": "工信部等八部门印发汽车行业稳增长工作方案（2025—2026年），部署稳定汽车产销增长、扩大新能源汽车消费等措施，推动汽车产业平稳运行。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040614.htm", "title": "市场监管总局等部门关于加快推进质量认证数字化发展的指导意见", "date": "2025-09-14", "lib": "部门文件", "topic_hint": "市场监管、安全生产监管\\其他", "hasBody": true, "importance": "中", "topic": "经济发展", "gist": "市场监管总局等部署质量认证数字化发展，到2030年选育10家数字化认证机构和50个数字化认证项目，到2035年建成质量认证数字技术体系和实施体系，赋能产业数字化转型。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040750.htm", "title": "外国驻华外交领事机构中国籍雇员管理条例", "date": "2025-09-15", "lib": "国务院文件", "topic_hint": "对外事务\\外交、外事", "hasBody": true, "importance": "中", "topic": "对外开放", "gist": "国务院公布外国驻华外交领事机构中国籍雇员管理条例，自2026年1月1日起施行，确立归口管理体制，由外事服务主管单位管理，通过人力资源平台招聘，外事服务机构与雇员签订劳动合同保障权益。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040752.htm", "title": "国务院办公厅关于进一步加强旅游市场综合监管的通知", "date": "2025-09-15", "lib": "国务院文件", "topic_hint": "商贸、海关、旅游\\旅游", "hasBody": true, "importance": "中", "topic": "社会治理", "gist": "国办发文加强旅游市场综合监管，建立职责明确、协同高效的监管机制，明确文旅、通信、公安等部门职责，按属地管理、部门联动原则，整治扰乱市场秩序、侵害游客权益等突出问题。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7040843.htm", "title": "国家外汇管理局关于深化跨境投融资外汇管理改革有关事宜的通知", "date": "2025-09-15", "lib": "部门文件", "topic_hint": "财政、金融、审计\\货币（含外汇）", "hasBody": true, "importance": "中", "topic": "对外开放", "gist": "国家外汇管理局深化跨境投融资外汇管理改革，取消境内直接投资前期费用登记和外商投资企业境内再投资登记，允许外商直接投资项下外汇利润境内再投资，便利科研机构接收境外资金，扩大跨境融资便利。"}, {"url": "https://www.gov.cn/zhengce/zhengceku/202509/content_7 function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
  const months = Object.keys(DATA).sort();
  let totalHigh = 0, total = 0;
  months.forEach(m => { totalHigh += DATA[m].high; total += DATA[m].count; });
  document.getElementById("topline").textContent =
    months.length + " 个月 · 共 " + total + " 份政策文件 · 核心考点 " + totalHigh + " 份";

  const body = document.getElementById("body");
  months.forEach(m => {
    const d = DATA[m];
    const wrap = document.createElement("div");
    wrap.className = "month";
    const [y, mo] = m.split("-");
    wrap.innerHTML = '<div class="mhead"><h2>' + y + ' 年 ' + parseInt(mo, 10) + ' 月</h2>' +
      '<span class="pill high">核心 ' + d.high + '</span>' +
      '<span class="pill">了解 ' + d.medium + '</span>' +
      '<span class="pill">细则 ' + d.low + '</span>' +
      '<span class="pill">共 ' + d.count + ' 份</span></div>';

    const groups = [["高","核心考点"],["中","了解即可"],["低","技术细则"]];
    groups.forEach(([imp, label]) => {
      const rows = d.items.filter(x => x.importance === imp);
      if (!rows.length) return;
      if (imp !== "高") {
        const det = document.createElement("details");
        det.innerHTML = '<summary>' + label + '（' + rows.length + '）</summary>';
        const box = document.createElement("div");
        rows.forEach(x => box.appendChild(card(x, imp)));
        det.appendChild(box);
        wrap.appendChild(det);
      } else {
        rows.forEach(x => wrap.appendChild(card(x, imp)));
      }
    });
    body.appendChild(wrap);
  });
}
function card(x, imp) {
  const el = document.createElement("div");
  el.className = "item " + (imp === "高" ? "high" : imp === "中" ? "medium" : "low");
  el.innerHTML =
    '<div class="row">' +
      '<span class="tag">' + esc(x.date.slice(5)) + '</span>' +
      '<span class="tag imp-' + (imp === "高" ? "high" : "") + '">' + esc(x.lib) + '</span>' +
      '<span class="tag topic">' + esc(x.topic) + '</span>' +
      (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">原文 ↗</a>' : '') +
    '</div>' +
    '<h3>' + esc(x.title) + '</h3>' +
    '<p class="gist">' + esc(x.gist || "（未生成要点）") + '</p>';
  return el;
}
render();
