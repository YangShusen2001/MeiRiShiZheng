# 每日自动更新：抓取 → 剪藏 → 生成 content → 构建前端 → 部署到 Cloudflare Pages
# 需要 3 个 GitHub Secrets：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / PUBLIC_API_BASE
name: daily

on:
  schedule:
    # 北京时间每天 06:00（UTC 前一天 22:00）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

# 同一分支只运行一个每日任务，避免两个机器人提交互相覆盖。
concurrency:
  group: daily-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装管道依赖
        run: pip install -e "./pipeline[dev]"

      - name: 管道单测
        run: pytest pipeline/tests -q

      - name: 抓取 + 生成 + 剪藏
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m kaogong --content-dir content

      - name: 生成后内容门禁
        run: pytest pipeline/tests/test_content_schema.py -q

      - name: 提交当日内容
        run: |
          git config user.name "kaogong-bot"
          git config user.email "kaogong-bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "今日无变化"
          else
            git commit -m "每日更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            # 定时任务运行期间 main 可能有新提交；基于最新远端提交重放机器人提交，禁止强推。
            git pull --rebase origin main
            git push
          fi

      - name: 生产发布阻塞门禁
        run: pnpm release:check

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        env:
          PUBLIC_API_BASE: ${{ secrets.PUBLIC_API_BASE }}
        run: pnpm --filter @kaogong/web build

      # ⚠️ workingDirectory 是必须的，不是可选优化。
      # wrangler-action 会以 workingDirectory 作为 cwd，去执行
      # `pnpm exec wrangler --version` 以及真正的部署命令。
      # 省略它则 cwd = 仓库根，而根 package.json 没有任何依赖、根 node_modules/.bin
      # 里没有 wrangler（它只声明在 apps/api 的 devDependencies）→ action 判定
      # "Wrangler not found"，转而走自动兜底 `pnpm add wrangler@4`，该命令在 pnpm
      # workspace 下被 ERR_PNPM_ADDING_TO_ROOT 拒绝（需 -w），部署步骤必红。
      # 指向 apps/api 后，版本检测与部署命令都在该包内解析，两处都不再依赖根。
      - name: 部署到 Cloudflare Pages
        id: pages-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # 相对 apps/api 解析 → 即 apps/web/dist
          command: pages deploy ../web/dist --project-name kaogong-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 记录 Pages 部署地址
        env:
          PUBLIC_SITE_URL: ${{ steps.pages-deploy.outputs.deployment-url }}
        run: |
          test -n "$PUBLIC_SITE_URL"
          echo "PUBLIC_SITE_URL=$PUBLIC_SITE_URL" >> "$GITHUB_ENV"
          echo "Pages deployment: $PUBLIC_SITE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: 部署后只读冒烟
        env:
          PUBLIC_API_BASE: ${{ secrets.PUBLIC_API_BASE }}
        run: pnpm test:smoke
