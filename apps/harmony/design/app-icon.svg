<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="0 0 216 216">
  <!--
    考公云 · 应用图标（矢量源文件）

    设计概念：一页被划亮的书
    - 底盘用品牌靛青（v3），保证在启动器网格上的识别度；
    - 书页用暖米（App 页面底色），呼应护眼阅读调性；
    - 右上折角让"这是一页纸"一眼可辨，不靠细节堆砌；
    - 最下方一条暖黄高亮 = 产品的核心动作（给时政原文划考点）。
      高亮色刻意取 App 内「考点」标注的 #FFE7A0，让图标与功能形成呼应。

    色彩取自 theme/Tokens.ets，不另立色值。
    满幅正方形：圆角由启动器遮罩施加，不要在画布内自画圆角，
    否则会被二次裁切露出透明缺口。
    安全区：主形留边 44/216 ≈ 20%，小于系统裁切半径。
  -->
  <rect width="216" height="216" fill="#3A4785"/>

  <!-- 书页：右上折角（折角处直接透出底盘绿，比再画一层翻折更干净） -->
  <path d="M 58,38 H 148 L 172,62 V 164 A 14,14 0 0 1 158,178 H 58 A 14,14 0 0 1 44,164 V 52 A 14,14 0 0 1 58,38 Z"
        fill="#F5F1E8"/>

  <!-- 文字线：用品牌靛的浅调，避免第二套色相 -->
  <rect x="62" y="76" width="92" height="10" rx="5" fill="#AEB6D8"/>
  <rect x="62" y="96" width="64" height="10" rx="5" fill="#AEB6D8"/>

  <!-- 高亮：产品核心动作的视觉提喻。
       内容块（76–140）在页面（38–178）内上下等距留白 38，避免重心下沉。 -->
  <rect x="62" y="122" width="92" height="18" rx="9" fill="#FFE7A0"/>
</svg>
